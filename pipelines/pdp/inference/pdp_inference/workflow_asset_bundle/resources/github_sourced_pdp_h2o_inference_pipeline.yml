resources:
  jobs:
    dev_vish_github_sourced_pdp_h2o_inference_pipeline:
      name: "[dev vish] github_sourced_pdp_h2o_inference_pipeline"
      max_concurrent_runs: 2
      tasks:
        - task_key: data_ingestion
          spark_python_task:
            python_file: pipelines/pdp/tasks/pdp_data_ingestion/pdp_data_ingestion.py
            parameters:
              - --cohort_file_name
              - "{{job.parameters.cohort_file_name}}"
              - --course_file_name
              - "{{job.parameters.course_file_name}}"
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --db_run_id
              - "{{job.parameters.db_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --gcp_bucket_name
              - "{{job.parameters.gcp_bucket_name}}"
              - --job_root_dir
              - /Volumes/{{job.parameters.DB_workspace}}/{{job.parameters.databricks_institution_name}}_gold/gold_volume/inference_jobs/{{job.parameters.db_run_id}}
              - --custom_schemas_path
              - "{{job.parameters.custom_schemas_path}}"
            source: GIT
          existing_cluster_id: 5319-145434-y2o286pn
          libraries:
            - pypi:
                package: git+https://github.com/datakind/student-success-tool.git@${var.pip_install_branch}
        - task_key: data_preprocessing
          depends_on:
            - task_key: data_ingestion
          spark_python_task:
            python_file: pipelines/pdp/tasks/pdp_data_preprocessing/pdp_data_preprocessing.py
            parameters:
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --db_run_id
              - "{{job.parameters.db_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --model_name
              - "{{job.parameters.model_name}}"
              - --cohort_dataset_validated_path
              - "{{tasks.data_ingestion.values.cohort_dataset_validated_path}}"
              - --course_dataset_validated_path
              - "{{tasks.data_ingestion.values.course_dataset_validated_path}}"
              - --toml_file_path
              - /Volumes/{{job.parameters.DB_workspace}}/{{job.parameters.databricks_institution_name}}_gold/gold_volume/inference_inputs/config.toml
              - --inference_toml_file_path
              - /Volumes/{{job.parameters.DB_workspace}}/{{job.parameters.databricks_institution_name}}_gold/gold_volume/inference_inputs/inference_config.toml
              - --custom_schemas_path
              - "{{job.parameters.custom_schemas_path}}"
            source: GIT
          existing_cluster_id: 5319-145434-y2o286pn
          libraries:
            - pypi:
                package: git+https://github.com/datakind/student-success-tool.git@${var.pip_install_branch}
        - task_key: data_validation
          depends_on:
            - task_key: data_preprocessing
          spark_python_task:
            python_file: pipelines/pdp/tasks/data_validation/data_validation_task.py
            parameters:
              - --input_table_path
              - "{{tasks.data_preprocessing.values.processed_dataset_path}}"
              - --input_schema_path
              - /Volumes/{{job.parameters.DB_workspace}}/{{job.parameters.databricks_institution_name}}_gold/gold_volume/inference_inputs/schema.pbtxt
              - --output_artifact_path
              - "{{tasks.data_ingestion.values.job_root_dir}}"
              - --environment
              - SERVING
              - "{{job.parameters.fail_on_anomalies}}"
              - --input_table_path
              - "{{tasks.data_preprocessing.values.processed_dataset_path}}"
              - --input_schema_path
              - /Volumes/{{job.parameters.DB_workspace}}/{{job.parameters.databricks_institution_name}}_gold/gold_volume/inference_inputs/schema.pbtxt
              - --output_artifact_path
              - "{{tasks.data_ingestion.values.job_root_dir}}"
              - --environment
              - SERVING
              - "{{job.parameters.fail_on_anomalies}}"
            source: GIT
          existing_cluster_id: 5319-145434-y2o286pn
          libraries:
            - pypi:
                package: tensorflow_data_validation==1.16.1
        - task_key: inference
          depends_on:
            - task_key: data_validation
          spark_python_task:
            python_file: pipelines/pdp/tasks/pdp_h2o_model_inference/pdp_h2o_model_inference.py
            parameters:
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --db_run_id
              - "{{job.parameters.db_run_id}}"
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --model_name
              - "{{job.parameters.model_name}}"
              - --model_type
              - "{{job.parameters.model_type}}"
              - --job_root_dir
              - "{{tasks.data_ingestion.values.job_root_dir}}"
              - --toml_file_path
              - "{{tasks.data_preprocessing.values.toml_file_path}}"
              - --processed_dataset_path
              - "{{tasks.data_preprocessing.values.processed_dataset_path}}"
              - --notification_email
              - "{{job.parameters.notification_email}}"
              - --DK_CC_EMAIL
              - "{{job.parameters.DK_CC_EMAIL}}"
              - --modeling_table_path
              - "{{job.parameters.DB_workspace}}.{{job.parameters.databricks_in\
                stitution_name}}_silver.modeling"
              - --custom_schemas_path
              - "{{job.parameters.custom_schemas_path}}"
            source: GIT
          existing_cluster_id: 5319-145434-y2o286pn
          libraries:
            - pypi:
                package: category-encoders==2.6.3
            - pypi:
                package: holidays==0.45
            - pypi:
                package: cloudpickle==2.2.1
            - pypi:
                package: databricks-automl-runtime==0.2.21
            - pypi:
                package: psutil==5.9.0
            - pypi:
                package: mlflow==2.19.0
            - pypi:
                package: lz4==4.3.2
            - pypi:
                package: git+https://github.com/datakind/student-success-tool.git@feat/h2o_sample_weight
        - task_key: output_publish
          depends_on:
            - task_key: inference
          spark_python_task:
            python_file: pipelines/pdp/tasks/pdp_inference_output_publish/pdp_inference_output_publish.py
            parameters:
              - --DB_workspace
              - "{{job.parameters.DB_workspace}}"
              - --databricks_institution_name
              - "{{job.parameters.databricks_institution_name}}"
              - --db_run_id
              - "{{job.parameters.db_run_id}}"
              - --gcp_bucket_name
              - "{{job.parameters.gcp_bucket_name}}"
              - --notification_email
              - "{{job.parameters.notification_email}}"
            source: GIT
          existing_cluster_id: 5319-145434-y2o286pn
          libraries:
            - pypi:
                package: git+https://github.com/datakind/student-success-tool.git@${var.pip_install_branch}
      job_clusters:
        - job_cluster_key: pdp-inference-pipeline-cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-cpu-ml-scala2.12
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            gcp_attributes:
              use_preemptible_executors: false
              availability: ON_DEMAND_GCP
              zone_id: HA
            node_type_id: n2-standard-16
            custom_tags:
              ResourceClass: SingleNode
              x-databricks-nextgen-cluster: "true"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
      git_source:
        git_url: https://github.com/datakind/student-success-tool
        git_provider: gitHub
        git_branch: feat/h2o_inference_pipeline
      tags:
        dev: vishakh_pillai
      queue:
        enabled: true
      parameters:
        - name: cohort_file_name
          default: synthetic_mdy_inference_ar_deid_studyid.csv
        - name: course_file_name
          default: synthetic_mdy_inference_course_level_ar_deid_studyid.csv
        - name: custom_schemas_path
          default: /Workspace/Users/kayla@datakind.org/sst-private/
        - name: databricks_institution_name
          default: synthetic_2
        - name: db_run_id
          default: "{{job.run_id}}"
        - name: DB_workspace
          default: staging_sst_01
        - name: DK_CC_EMAIL
          default: vishakh@datakind.org
        - name: fail_on_anomalies
          default: --fail_on_anomalies_false
        - name: gcp_bucket_name
          default: databricks-2052166062819251-unitycatalog
        - name: model_name
          default: synthetic_2_graduation_4y_end_of_first_year
        - name: model_type
          default: sklearn
        - name: notification_email
          default: vishakh@datakind.org
        - name: version_id
          default: "1"
